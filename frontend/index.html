<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<title>
DataLens 智能分析助手
</title>


<link rel="stylesheet" href="./css/style.css">


<!-- ECharts -->
<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>


</head>


<body>


<div class="app">



<!-- ===================
左侧
=================== -->


<div class="sidebar">


<div class="logo">

📊 DataLens

<br>

<span>
智能分析助手
</span>


</div>



<div class="menu active">

💬 智能问答

</div>


<div class="menu">

📈 数据分析

</div>


<div class="menu">

📉 可视化图表

</div>


<div class="menu">

🗂 数据集管理

</div>


<div class="menu">

⚙ 系统设置

</div>





<button 
class="upload-btn"
onclick="selectCSV()"
>

＋ 上传数据文件

</button>



<input 

type="file"

id="csvFile"

accept=".csv"

hidden

onchange="uploadCSV()"

/>




<h3>
当前数据集
</h3>



<!-- 动态加载 -->

<div id="datasetList">


<div class="dataset">

正在加载...

</div>


</div>




</div>








<!-- ===================
聊天区域
=================== -->


<div class="chat-panel">


<div class="header">

智能问答

</div>





<div id="chatBox"
class="chat-box">



<div class="ai bubble">


你好，我是DataLens，可以帮你分析数据。


</div>


</div>






<div class="input-area">


<input

id="msg"

placeholder="请输入你的问题，例如：哪个地区销售最高"


>



<button 
onclick="sendMsg()"
>

发送

</button>


</div>



</div>









<!-- ===================
分析区域
=================== -->


<div class="analysis">





<div class="card">


<h3>

📊 可视化结果

</h3>


<div 

id="chart"

style="
height:350px;
width:100%;
">

</div>


</div>







<div class="card">


<h3>

📋 数据结果

</h3>


<div id="tableBox">

暂无数据

</div>


</div>









<div class="card">


<h3>

SQL

</h3>


<pre id="sqlBox">

暂无SQL

</pre>


</div>






</div>




</div>





<script src="./js/app.js"></script>



</body>


</html>
